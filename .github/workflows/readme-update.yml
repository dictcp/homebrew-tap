name: Update README Formula/Cask List

on:
  push:
    branches:
      - master
    paths:
      - 'Formula/**'
      - 'Casks/**'
  schedule:
    - cron: '0 7 * * 1'  # Every Monday at 07:00 UTC (after update-check runs)
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Use a token that can push directly to the branch
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Regenerate formula/cask table in README
        run: python3 .github/scripts/update_readme.py

      - name: Commit and push if README changed
        run: |
          if git diff --quiet README.md; then
            echo "README.md unchanged — nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add README.md
          git commit -m "docs: update formula/cask list in README"
          git push origin HEAD
